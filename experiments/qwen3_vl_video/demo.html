<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenHalo · Qwen 实时视觉 Demo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#10131b;color:#e5eafa}*{box-sizing:border-box}body{max-width:1480px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 12px}p{color:#a9b5cd;line-height:1.7;font-size:14px}button{border:1px solid #495775;background:#252e43;color:#fff;border-radius:9px;padding:11px 16px;cursor:pointer}button.primary{background:#a2ead3;color:#10261e;border-color:#a2ead3;font-weight:700}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:10px;flex-shrink:0}.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:20px}.panel,.stat{border:1px solid #2d3549;background:#1b2030;border-radius:12px;padding:18px}.screen{background:#080b12;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:9px}.screen img{width:100%;height:100%;object-fit:contain}.screen img:not([src]){display:none}.screen span{position:absolute;top:10px;left:10px;background:#111a27dd;padding:5px 9px;border-radius:6px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:13px}.stat span{font-size:12px;color:#a9b5cd}.stat b{display:block;font-size:24px;margin-top:7px}#status{color:#a2ead3}#error{color:#ffb6aa;white-space:pre-wrap}#answer{font-size:18px;line-height:1.75;white-space:pre-wrap;min-height:160px;overflow-wrap:anywhere}.samples{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.samples img{width:100%;aspect-ratio:16/9;border-radius:5px}.samples figure{margin:0}.samples figcaption{color:#a9b5cd;font-size:11px;margin:3px 0 7px}.history{margin-top:20px}.entry{padding:14px 0;border-top:1px solid #30394d}.entry button{padding:5px 9px;margin-right:10px}.entry p{margin:8px 0;white-space:pre-wrap}#run{font-family:monospace;font-size:12px;overflow-wrap:anywhere}.hint{font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}body{padding:16px}}
</style>
<header><div><h1>OpenHalo · Qwen 实时视觉 Demo</h1><p>480p · 每批 16 帧 · 采集与推理同时进行 · 上一批完成后立即交接</p></div><div class="actions"><button class="primary" id="start">开始摄像头分析</button><button id="stop" disabled>停止</button></div></header>
<p id="status" role="status">正在连接 Jetson…</p><p id="error" role="alert"></p>
<div class="layout"><main><section class="panel"><h2>摄像头预览</h2><div class="screen"><img id="live" alt="摄像头当前画面"><span id="liveLabel">摄像头未启动</span></div><p class="hint">点击开始后，先加载模型，再开启摄像头。每次最多运行 10 分钟，可随时停止；结束后保留本轮结果供查看。</p></section><div class="stats"><div class="stat"><span>最近一次完整回答</span><b id="latency">—</b></div><div class="stat"><span>本批视频时长</span><b id="window">—</b></div><div class="stat"><span>已完成批次</span><b id="count">0</b></div></div><section class="panel history"><h2>判断历史</h2><div id="history"><p>开始后，每次完整回答会出现在这里。</p></div></section></main>
<aside class="panel"><h2 id="answerTitle">模型判断</h2><p id="range">等待第一批结果</p><div id="answer">模型原始回答将显示在这里。</div><p class="hint">这些是模型输出，可能漏判或编造；尚未接入后端。描述对应下方采样画面，不一定对应左侧当前预览。</p><h2>这次实际分析的 16 帧</h2><div class="samples" id="samples"></div><p id="age"></p><p id="run"></p></aside></div>
<script>
const $=id=>document.getElementById(id);let state=null,shown=null,follow=true,runId=null;const sec=v=>Number(v).toFixed(2)+' 秒';
const phases={idle:'准备就绪，点击开始后开启摄像头分析',loading:'正在加载并预热模型，摄像头尚未开启（通常约 1 分钟）',capturing:'正在采集并连续分析',stopping:'正在停止摄像头并结束本轮分析',stopped:'本轮已结束，摄像头已停止；可以查看历史或重新开始',error:'实验已停止，请查看错误信息'};
async function action(path){$('start').disabled=true;try{const r=await fetch(path,{method:'POST'});if(!r.ok)throw Error('操作失败：'+r.status);}catch(e){$('error').textContent=e.message;}}
$('start').onclick=()=>{follow=true;action('/api/start')};$('stop').onclick=()=>action('/api/stop');
function showResult(r){if(!r)return;shown=r.batch_id;$('answerTitle').textContent=`模型判断 · 第 ${r.batch_id+1} 批`;$('answer').textContent=r.text||'没有返回文字';const base=state.results[0].window_start;$('range').textContent=`采集时间段：本轮第 ${(r.window_start-base).toFixed(1)}–${(r.window_end-base).toFixed(1)} 秒 · ${r.unique_selected} 张不同画面 · ${r.finish_reason==='stop'?'回答完整结束':'达到输出上限，可能不完整'}`;$('age').textContent=`回答返回时：最新输入画面已过去 ${sec(r.newest_frame_age_s)}，最早输入画面已过去 ${sec(r.oldest_frame_age_s)}。`;$('samples').replaceChildren();r.selected.forEach((f,i)=>{const fig=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=`/sample.jpg?run=${encodeURIComponent(state.run)}&batch=${r.batch_id}&index=${i}`;img.alt=`第 ${i+1} 张实际输入`;cap.textContent=`${(f.mono-base).toFixed(2)} 秒`;fig.append(img,cap);$('samples').append(fig)})}
function paint(s){const changedRun=runId!==s.run;state=s;if(changedRun){runId=s.run;shown=null;follow=true;$('samples').replaceChildren();$('answer').textContent='等待本轮第一批完整回答…';$('range').textContent='等待第一批结果';$('age').textContent='';$('live').removeAttribute('src')}
$('start').disabled=s.active;$('stop').disabled=!s.active;$('status').textContent=phases[s.phase]||s.phase;$('error').textContent=s.error||'';$('liveLabel').textContent=s.camera_live?'当前摄像头画面':s.latest_frame?'最后一帧 · 采集已停止':'摄像头未启动';$('run').textContent=s.run?`本轮记录：${s.run}`:'';const latest=s.results.at(-1);$('count').textContent=s.results.length;$('latency').textContent=latest?sec(latest.seconds):'—';$('window').textContent=latest?sec(latest.window_s):'—';if(latest&&(follow&&shown!==latest.batch_id||shown===null))showResult(latest);
const history=$('history');history.replaceChildren();if(!s.results.length){history.textContent='等待模型返回第一批结果。'}s.results.slice().reverse().forEach(r=>{const div=document.createElement('div'),button=document.createElement('button'),label=document.createElement('span'),p=document.createElement('p');div.className='entry';button.textContent=`查看第 ${r.batch_id+1} 批`;button.onclick=()=>{follow=r.batch_id===state.results.at(-1).batch_id;showResult(r)};label.textContent=sec(r.seconds);p.textContent=r.text;div.append(button,label,p);history.append(div)});}
async function poll(){try{const r=await fetch('/api/state');if(!r.ok)throw Error(r.status);paint(await r.json())}catch(e){$('error').textContent='与 Jetson 的连接中断：'+e.message}setTimeout(poll,800)}
function preview(){if(state?.latest_frame&&(state.camera_live||!$('live').getAttribute('src'))){$('live').src='/frame.jpg?t='+Date.now()}setTimeout(preview,250)}poll();preview();
</script></html>
