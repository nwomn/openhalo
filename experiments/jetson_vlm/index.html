<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenHalo · 视觉判断实验</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10131b;color:#e5eafa}
body{margin:0;padding:24px;max-width:1440px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:22px;margin:0}p{color:#9da9bd;font-size:14px;line-height:1.7}button{background:#252c3d;color:#fff;border:1px solid #47546e;padding:9px 14px;border-radius:7px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,1fr);gap:20px;margin-top:18px}.video{position:relative;background:#050608;overflow:hidden;border-radius:12px;line-height:0}.video img{width:100%;display:block;min-height:160px}.video svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.subtitle{position:absolute;bottom:12px;left:5%;right:5%;line-height:1.5;text-align:center;font-size:20px;white-space:pre-line;background:#080b15c9;padding:8px;border-radius:6px}.subtitle:empty{display:none}.badge{font-size:12px;color:#9ee6d1;background:#21332f;padding:5px 10px;border-radius:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat,aside{background:#1b2030;border:1px solid #2d3549;border-radius:10px;padding:14px}.stat b{display:block;font-size:21px;margin-top:6px}.stat span{color:#a9b5cd;font-size:12px}aside h2{font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#b5c5e9}#error{color:#ffab9f;white-space:pre-wrap}#snapshot{width:100%;border-radius:7px}#snapshot:not([src]){display:none}#freshness{font-size:13px;color:#adbad1}.hint{font-size:12px} @media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<header><div><h1>OpenHalo · 视觉判断实验</h1><p id="config">正在连接实验…</p></div><button id="pause">暂停分析</button></header>
<div class="layout"><main><div class="video"><img id="live" alt="实时摄像头"><svg id="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg><div id="subtitle" class="subtitle"></div></div>
<div class="stats"><div class="stat"><span>采集帧率（不是模型帧率）</span><b id="fps">—</b></div><div class="stat"><span>首个输出片段</span><b id="first">—</b></div><div class="stat"><span>请求总耗时</span><b id="latency">—</b></div><div class="stat"><span>输出 token 数</span><b id="tokens">—</b></div></div>
<span id="status" class="badge">等待画面</span><p id="freshness"></p><p id="error"></p>
<p class="hint">预览持续刷新；模型每次取最新帧。框的位置来自采样帧，尚未做跟踪；标注过期后隐藏。首个输出片段通常只是 JSON 开头，不等于判断已经可用。</p>
</main><aside><h2>模型实际分析的画面</h2><img id="snapshot" alt="最近一次完成分析的原始画面"><p id="sample">尚无结果</p><h2>模型输出</h2><pre id="raw">等待模型…</pre><p class="hint">显示描述与坐标，不表示内部完整思考过程。</p><h2>实验记录</h2><pre id="run"></pre></aside></div>
<script>
const $=id=>document.getElementById(id); let state=null, resultId=null;
const sec=x=>x==null?'—':x.toFixed(2)+' s';
let frameStart=0;
function nextFrame(){frameStart=performance.now();$('live').src='/frame.jpg?t='+Date.now();}
$('live').onload=()=>setTimeout(nextFrame,Math.max(0,33-(performance.now()-frameStart)));
$('live').onerror=()=>setTimeout(nextFrame,1000);
nextFrame();
function paint(s){
 state=s; const c=s.config,r=s.result;
 $('config').textContent=`${c.model} · 任务 ${c.task} · 显示 ${c.display} · 输入宽度 ${c.input_width}px`;
 $('fps').textContent=s.capture_fps.toFixed(1); $('run').textContent=s.run_dir;
 $('pause').textContent=s.enabled?'暂停分析':'继续分析';
 $('status').textContent=s.status==='analyzing'?(s.enabled?'正在分析，预览继续':'本次分析完成后暂停'):s.enabled?'等待下一次分析':'分析已暂停';
 $('error').textContent=s.camera_error||s.error||'';
 $('overlay').replaceChildren(); $('subtitle').textContent='';
 if(!r)return;
 $('first').textContent=sec(r.first_content_s); $('latency').textContent=sec(r.request_s); $('tokens').textContent=r.output_tokens??'—';
 const age=s.server_time-r.captured_at,expired=s.server_time-r.completed_at>c.overlay_ttl;
 $('freshness').textContent=`判断来自 ${age.toFixed(1)} 秒前的画面 · 第 ${r.request} 次请求${expired?' · 标注已过期':''}`;
 $('sample').textContent=`原始帧 #${r.frame} · 采样至结果 ${sec(r.frame_to_result_s)} · 加载 ${sec(r.load_s)}`;
 $('raw').textContent=r.raw||r.error||'';
 if(resultId!==r.request){$('snapshot').src='/snapshot.jpg?id='+r.request;resultId=r.request;}
 if(!r.ok||expired)return;
 if(c.display==='subtitles'){$('subtitle').textContent=r.items.map(i=>i.label).join(' · ');return;}
 for(const item of r.items){
  const [x1,y1,x2,y2]=item.bbox;
  const group=document.createElementNS('http://www.w3.org/2000/svg','g');
  const rect=document.createElementNS(group.namespaceURI,'rect');
  for(const [k,v] of Object.entries({x:x1,y:y1,width:x2-x1,height:y2-y1,fill:'none',stroke:'#8df1cf','stroke-width':3,'stroke-dasharray':'8 5'}))rect.setAttribute(k,v);
  const text=document.createElementNS(group.namespaceURI,'text');
  for(const [k,v] of Object.entries({x:Math.min(x1+5,700),y:Math.max(28,y1-10),fill:'#c1ffe9','font-size':25,stroke:'#07120d','stroke-width':5,'paint-order':'stroke'}))text.setAttribute(k,v);
  text.textContent=item.label;group.append(rect,text);$('overlay').append(group);
 }
}
$('pause').onclick=async()=>{if(state)await fetch(state.enabled?'/api/pause':'/api/resume',{method:'POST'});};
async function poll(){try{const response=await fetch('/api/state');if(!response.ok)throw Error('状态连接失败');paint(await response.json());}catch(e){$('error').textContent='连接中断：'+e.message;}setTimeout(poll,250);}poll();
</script></html>
